<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CALIBRE X-ray options</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0a0c10; color: #e7eaf0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: #8f98a8; margin: 0 0 16px; }
    label { display: block; margin: 20px 0 6px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 8px; border: 1px solid #232935; background: #11141a; color: #e7eaf0; font: inherit; }
    input:focus { outline: 2px solid #5eead4; outline-offset: 1px; }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { padding: 8px 14px; border-radius: 8px; border: 1px solid #232935; background: #161a22; color: #e7eaf0; font: inherit; cursor: pointer; }
    button:hover { border-color: #5eead4; }
    button.primary { background: #5eead4; color: #0a0c10; border-color: #5eead4; font-weight: 600; }
    #status { min-height: 1.5em; margin-top: 14px; }
    .ok { color: #4ade80; } .bad { color: #fb7185; }
    small { color: #5d6676; display: block; margin-top: 6px; }
    code { background: #161a22; border: 1px solid #232935; border-radius: 4px; padding: 0 4px; }
  </style>
</head>
<body>
  <main>
    <h1>CALIBRE Whale X-ray</h1>
    <p>The panel on polymarket.com gets its X-rays from a CALIBRE site. Point it at the deployed site, or at your local one while developing.</p>
    <form id="form">
      <label for="api-base">API base URL</label>
      <input id="api-base" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://your-site.vercel.app">
      <small>Default: <code>http://localhost:3000</code> (run <code>pnpm --filter @calibre/web dev</code>). For the deployed site, use its https address.</small>
      <div class="row">
        <button class="primary" type="submit">Save</button>
        <button id="test" type="button">Test</button>
        <button id="reset" type="button">Reset to default</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
